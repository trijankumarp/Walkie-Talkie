<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkie Talkie | M-OS</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    :root {
      --blue: #2563eb;
      --blue-light: #3b82f6;
      --blue-soft: #dbeafe;
      --white: #ffffff;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-400: #94a3b8;
      --gray-600: #475569;
      --gray-800: #1e293b;
      --red: #dc2626;
      --red-bg: #fef2f2;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, var(--gray-100) 0%, var(--blue-soft) 100%);
      color: var(--gray-800);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 16px;
      background: var(--white);
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(37, 99, 235, 0.08);
    }
    header {
      text-align: center;
      padding: 20px 16px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      color: var(--blue);
      letter-spacing: 0.5px;
    }
    h2.panel-title {
      text-align: center;
      color: var(--blue);
      margin-top: 0;
      font-size: 20px;
    }
    .status {
      padding: 12px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      color: var(--gray-600);
      margin-bottom: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background: var(--blue);
      color: var(--white);
      border: none;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--blue-light); }
    .btn:active { transform: scale(0.98); }
    .btn-logout { background: var(--gray-600); }
    .btn-logout:hover { background: var(--gray-800); }

    .list, .channel-list {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      padding: 12px;
      margin: 12px 0;
      border-radius: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    .channel-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      margin: 8px 0;
      border-radius: 8px;
      cursor: pointer;
    }
    .channel-item:hover { background: var(--blue-soft); }
    .channel-item.active {
      background: var(--blue-soft);
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
    .channel-name { flex: 1; font-weight: 500; color: var(--gray-800); }
    .channel-empty {
      text-align: center;
      color: var(--gray-400);
      padding: 20px 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .delete-btn {
      background: var(--red);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .item {
      padding: 12px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      margin: 6px 0;
      border-radius: 8px;
      color: var(--gray-600);
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin: 6px 0 10px;
      background: var(--white);
      color: var(--gray-800);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.2s, background 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    input.input-error {
      border-color: var(--red);
      background: var(--red-bg);
      color: var(--red);
    }
    .add-channel { display: flex; gap: 10px; margin: 12px 0; }

    .talk-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 24px 0 16px;
      padding: 12px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 16px;
    }
    .ptt-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .ptt-ring {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ptt-ring::before,
    .ptt-ring::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(37, 99, 235, 0.25);
      animation: siri-ring 2.4s ease-out infinite;
    }
    .ptt-ring::after { animation-delay: 1.2s; }
    .ptt-orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: radial-gradient(circle at 32% 28%, #93c5fd 0%, #3b82f6 40%, #2563eb 70%, #1d4ed8 100%);
      box-shadow: 0 8px 32px rgba(37, 99, 235, 0.35);
      transition: transform 0.15s ease;
      user-select: none;
      cursor: pointer;
    }
    .ptt-orb.talking {
      background: radial-gradient(circle at 32% 28%, #bfdbfe 0%, #60a5fa 45%, #2563eb 100%);
      animation: siri-breathe 0.9s ease-in-out infinite;
    }
    .ptt-orb:active { transform: scale(0.96); }
    .ptt-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .ptt-text {
      color: var(--white);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .ptt-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--gray-400);
      text-align: center;
    }

    .mute-side {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
      padding: 0;
    }
    .mute-side:hover { background: var(--gray-100); border-color: var(--blue); }
    .mute-side.muted {
      background: var(--red-bg);
      border-color: var(--red);
      color: var(--red);
    }
    .mute-side .mute-icon { font-size: 26px; line-height: 1; }
    .mute-side .mute-label { font-size: 11px; font-weight: 600; text-transform: uppercase; }

    @keyframes siri-ring {
      0% { transform: scale(0.85); opacity: 0.6; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    @keyframes siri-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .btn-connect { background: var(--blue); }
    .btn-disconnect { background: var(--gray-600); margin-top: 8px; }
    .section-title {
      color: var(--blue);
      margin: 18px 0 8px;
      font-size: 16px;
      font-weight: 600;
    }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .auth-tab {
      flex: 1;
      padding: 12px;
      background: var(--gray-50);
      color: var(--gray-600);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-tab.active {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
    }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
    .field-label {
      display: block;
      font-size: 13px;
      color: var(--gray-600);
      margin: 10px 0 2px;
      font-weight: 500;
    }
    .auth-hint { font-size: 12px; color: var(--gray-400); text-align: center; margin-top: 8px; }
    .auth-error {
      color: var(--red);
      background: var(--red-bg);
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      text-align: center;
      margin: 8px 0;
      min-height: 18px;
    }
    .btn-google {
      background: var(--white);
      color: var(--gray-800);
      border: 1px solid var(--gray-200);
    }
    .btn-google:hover { background: var(--gray-50); }
    .btn-secondary {
      background: var(--white);
      color: var(--blue);
      border: 1px solid var(--blue);
    }
    .btn-secondary:hover { background: var(--blue-soft); }
    .info-banner {
      background: var(--blue-soft);
      border: 1px solid #93c5fd;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      color: var(--gray-600);
      margin: 10px 0;
      line-height: 1.5;
    }
    .item.ok { border-left: 3px solid var(--blue); }
    .item.warn { border-left: 3px solid #f59e0b; }
    .accent { color: var(--blue); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>WALKIE TALKIE</h1>
      <div id="status" class="status">Offline • Ready</div>
    </header>

    <!-- Login / Sign Up -->
    <div id="loginScreen">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabLogin" onclick="showAuthTab('login')">Login</button>
        <button type="button" class="auth-tab" id="tabSignup" onclick="showAuthTab('signup')">Sign Up</button>
      </div>

      <div id="authError" class="auth-error"></div>

      <!-- Login -->
      <div id="panelLogin" class="auth-panel active">
        <h2 class="panel-title">Login</h2>
        <label class="field-label" for="loginEmail">Gmail / Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@gmail.com" autocomplete="email">
        <label class="field-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password">
        <button class="btn" id="btnLogin" onclick="login()">LOGIN</button>
        <button type="button" class="btn btn-google" id="btnGoogle" onclick="loginWithGoogle()">
          <span>G</span> Sign in with Google
        </button>
        <p class="auth-hint">Use Gmail or Google account to sign in</p>
      </div>

      <!-- Sign Up -->
      <div id="panelSignup" class="auth-panel">
        <h2 class="panel-title">Sign Up</h2>
        <label class="field-label" for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="Your name" autocomplete="name">
        <label class="field-label" for="signupEmail">Gmail / Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@gmail.com" autocomplete="email">
        <label class="field-label" for="signupMobile">Mobile (optional)</label>
        <input type="tel" id="signupMobile" placeholder="10-digit mobile number" autocomplete="tel">
        <label class="field-label" for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Min 6 characters" autocomplete="new-password">
        <label class="field-label" for="signupConfirm">Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Re-enter password" autocomplete="new-password">
        <button class="btn" id="btnSignup" onclick="signup()">CREATE ACCOUNT</button>
        <p class="auth-hint" style="margin:16px 0 8px;">— or —</p>
        <button type="button" class="btn btn-google" id="btnGoogleSignup" onclick="signupWithGoogle()">
          <span>G</span> Sign up with Google
        </button>
        <p class="auth-hint">New user? Google creates your account in one tap</p>
        <button type="button" class="btn btn-secondary" onclick="showAuthTab('login')">Already have account? Login</button>
      </div>
    </div>

    <!-- Main UI -->
    <div id="mainUI" style="display:none;">
      <div class="section-title">Channels</div>
      <div class="add-channel">
        <input type="text" id="newChannelName" placeholder="Create channel name (e.g. Team A)">
        <button class="btn" style="width:auto; padding:14px 24px;" onclick="addNewChannel()">+ CREATE</button>
      </div>
      <div class="channel-list" id="channelList"></div>

      <div class="talk-row">
        <div class="ptt-col">
          <div class="ptt-ring">
            <div class="ptt-orb" id="pttBtn"
                 onmousedown="startTalk()"
                 onmouseup="stopTalk()"
                 onmouseleave="stopTalk()"
                 ontouchstart="startTalk(event)"
                 ontouchend="stopTalk(event)">
              <div class="ptt-icon" id="pttIcon">🎙</div>
              <span class="ptt-text" id="pttLabel">Hold to talk</span>
            </div>
          </div>
          <p class="ptt-hint" id="pttHint">Select or create a channel first</p>
        </div>
        <button type="button" class="mute-side" id="muteBtn" onclick="toggleMute()" aria-label="Mute">
          <span class="mute-icon" id="muteIcon">🔊</span>
          <span class="mute-label" id="muteLabel">Mute</span>
        </button>
      </div>

      <div class="section-title">Connect</div>
      <button class="btn btn-connect" onclick="scanBluetooth()">Bluetooth Scan & Connect</button>
      <div class="list" id="btList">Tap above to pick a Bluetooth device</div>
      <button class="btn btn-disconnect" id="btnBtDisconnect" style="display:none;" onclick="disconnectBluetooth()">Disconnect Bluetooth</button>

      <button class="btn" onclick="scanWiFi()">Team WiFi Connect</button>
      <div class="list" id="wifiList">
        <div class="item">Tap above for WiFi / team steps</div>
      </div>

      <div class="status" id="connStatus">No connection</div>

      <button class="btn btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
